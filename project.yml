name: TideCam
options:
  bundleIdPrefix: com.jdarkyeka6
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1"
targets:
  TideCam:
    type: application
    platform: iOS
    sources:
      - path: TideCam
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdarkyeka6.TideCam
        INFOPLIST_FILE: TideCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: TideCam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - TideCamTests
  TideCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TideCamTests
    dependencies:
      - target: TideCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jdarkyeka6.TideCamTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TideCam:
    build:
      targets:
        TideCam: all
        TideCamTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TideCamTests
    archive:
      config: Release
